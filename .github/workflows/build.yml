name: Build

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS package
            os: macos-latest
            package_script: dist:mac
          - name: Windows package
            os: windows-latest
            package_script: dist:win

    env:
      MAIN_VITE_MICROSOFT_CLIENT_ID: ${{ secrets.MAIN_VITE_MICROSOFT_CLIENT_ID }}
      MAIN_VITE_MICROSOFT_TENANT_ID: consumers

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate login configuration
        shell: bash
        run: |
          if [[ ! "$MAIN_VITE_MICROSOFT_CLIENT_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ || "$MAIN_VITE_MICROSOFT_CLIENT_ID" == "00000000-0000-0000-0000-000000000000" ]]; then
            echo "::error::Set MAIN_VITE_MICROSOFT_CLIENT_ID to the registered desktop application client ID before packaging."
            exit 1
          fi

      - name: Typecheck and build
        run: npm run build

      - name: Package
        run: npm run ${{ matrix.package_script }} -- --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: release/*
          if-no-files-found: error

